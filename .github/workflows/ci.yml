name: CI

# Chaque push (toutes branches) lance la CI, visible dans l'onglet Actions.
# Le déploiement du front (Vercel) ne tourne que sur main.
on:
  push:

# Organisation (de gauche à droite dans l'onglet Actions) :
#   1. i18n · API · Install · Install        (installs mis en cache)
#   2. API · contrôles  /  contrôles du front (matrices, en parallèle)
#      API · Paquet Lambda
#   3. API · Build + /health  /  Build
#   4. E2E (Playwright)
#   5. Deploy (Vercel)                              (main uniquement)
#
# L'API (AWS Lambda) se déploie à la main : cd back && npm run deploy:lambda
#
# Les jobs « Install » font npm ci une seule fois et mettent node_modules en
# cache ; les jobs suivants le restaurent au lieu de tout réinstaller.

env:
  NODE_VERSION: 24

jobs:
  # ---------------------------------------------------------------- 1. Départ

  i18n:
    name: i18n (clés des locales)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-locales.mjs

  api-install:
    name: API · Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: back/package-lock.json
      - id: cache
        uses: actions/cache@v4
        with:
          path: back/node_modules
          key: api-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('back/package-lock.json') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: back

  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json
      # .nuxt (généré par nuxt prepare au postinstall) sert au lint et aux types
      - id: cache
        uses: actions/cache@v4
        with:
          path: |
            front/node_modules
            front/.nuxt
          key: front-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('front/package-lock.json') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: front

  # ------------------------------------------------------ 2. Contrôles (API)

  api-checks:
    name: API · ${{ matrix.check.name }}
    needs: [i18n, api-install]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: 'Format (Prettier)', run: 'npm run format:check' }
          - { name: 'Lint (ESLint)', run: 'npm run lint' }
          - { name: 'Typecheck', run: 'npm run typecheck' }
          - { name: 'Tests (Vitest)', run: 'npm test' }
          - { name: 'Tests BDD (Postgres)', run: 'npm run test:db', db: true }
    # PostgreSQL jetable, démarré seulement pour « Tests BDD » (image vide = pas de service)
    services:
      postgres:
        image: ${{ matrix.check.db && 'postgres:17' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.check.db && 'postgres://postgres:postgres@localhost:5432/postgres' || '' }}
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: back/node_modules
          key: api-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('back/package-lock.json') }}
          fail-on-cache-miss: true
      - run: ${{ matrix.check.run }}

  # Vérifie que le paquet Lambda (un seul fichier, bundlé par esbuild) se
  # construit. Le déploiement de la Lambda se fait à la main :
  # cd back && npm run deploy:lambda
  api-package:
    name: API · Paquet Lambda
    needs: [api-install]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: back/node_modules
          key: api-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('back/package-lock.json') }}
          fail-on-cache-miss: true
      - run: npm run package:lambda

  # ----------------------------------------------------- 2. Contrôles (front)

  checks:
    name: ${{ matrix.check.name }}
    needs: [i18n, install]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: 'Format (Prettier)', run: 'npm run format:check' }
          - { name: 'Lint (ESLint)', run: 'npm run lint' }
          - { name: 'Typecheck', run: 'npm run typecheck' }
          - { name: 'Tests (Vitest)', run: 'npm test' }
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            front/node_modules
            front/.nuxt
          key: front-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('front/package-lock.json') }}
          fail-on-cache-miss: true
      - run: ${{ matrix.check.run }}

  # ------------------------------------------------------------------ 3. Builds

  api-build:
    name: API · Build + /health
    needs: [api-checks]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: back/node_modules
          key: api-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('back/package-lock.json') }}
          fail-on-cache-miss: true
      - run: npm run build
      # On démarre l'API buildée et on vérifie GET /health
      - name: Smoke test GET /health
        run: |
          PORT=3001 npm start &
          for _ in $(seq 1 20); do
            curl -sf http://localhost:3001/health && exit 0
            sleep 0.5
          done
          echo "GET /health n'a pas répondu 200" && exit 1

  build:
    name: Build
    needs: [checks]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            front/node_modules
            front/.nuxt
          key: front-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('front/package-lock.json') }}
          fail-on-cache-miss: true
      - run: npm run build

  # -------------------------------------------------------------------- 4. E2E

  # Le front et la vraie API ensemble, dans un navigateur (PokéAPI simulée)
  e2e:
    name: E2E (Playwright)
    needs: [api-build, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: back/node_modules
          key: api-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('back/package-lock.json') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: |
            front/node_modules
            front/.nuxt
          key: front-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('front/package-lock.json') }}
          fail-on-cache-miss: true
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: front
      - name: Playwright
        run: npm run test:e2e
        working-directory: front
      # En cas d'échec : rapport HTML, captures et traces téléchargeables
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: front/playwright-report
          retention-days: 7

  # ------------------------------------------------- 5. Déploiements (main)

  # Front Nuxt (SSR) sur Vercel, une fois E2E et builds verts.
  # Secrets GitHub : VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID ;
  # variable GitHub : FRONT_URL (vérification SSR après déploiement).
  deploy-vercel:
    name: Deploy (Vercel)
    needs: [e2e, build, api-package]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Secrets et variable Vercel rangés dans l'environnement GitHub « prod »
    environment:
      name: prod
      url: ${{ vars.FRONT_URL }}
    concurrency:
      group: deploy-vercel
      cancel-in-progress: false
    env:
      # Lus en secret ou, à défaut, en variable de l'environnement « prod »
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || vars.VERCEL_TOKEN }}
      FRONT_URL: ${{ vars.FRONT_URL }}
    # Le projet Vercel a « front » comme Root Directory : la CLI se lance
    # donc depuis la racine du dépôt (sinon elle chercherait front/front).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            front/node_modules
            front/.nuxt
          key: front-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('front/package-lock.json') }}
          fail-on-cache-miss: true
      # Réglages et variables (NUXT_PUBLIC_API_BASE…) du projet Vercel
      - run: npx vercel@65 pull --yes --environment=production --token="$VERCEL_TOKEN"
      # Hors des serveurs Vercel, Nuxt ne détecte pas Vercel tout seul :
      # on force le format attendu (.vercel/output, fonctions SSR)
      - run: npx vercel@65 build --prod --token="$VERCEL_TOKEN"
        env:
          NITRO_PRESET: vercel
          NUXT_PUBLIC_API_BASE: https://3z9imkuxde.execute-api.eu-north-1.amazonaws.com
      - run: npx vercel@65 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      # Le HTML d'une fiche doit sortir du serveur déjà rempli (SSR)
      - name: Vérification SSR (/pokemon/25)
        if: env.FRONT_URL != ''
        run: |
          html=$(curl -sf --retry 3 --retry-all-errors "$FRONT_URL/pokemon/25")
          echo "$html" | grep -o '<title>[^<]*</title>'
          echo "$html" | grep -q 'Pikachu' || { echo "Fiche absente du HTML"; exit 1; }

  # Site statique (SSG) sur S3 + CloudFront, une fois E2E et builds verts :
  # generate (une page HTML par Pokémon), envoi S3, vidage du cache CDN.
  # Authentification AWS par OIDC, sans clé : rôle pokewish-github-deploy
  # (front/scripts/setup-github-static-deploy.sh). Pas d'environnement GitHub
  # ici : il changerait l'identité OIDC envoyée à AWS.
  deploy-static:
    name: Deploy (S3 + CloudFront)
    needs: [e2e, build, api-package]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-static
      cancel-in-progress: false
    permissions:
      id-token: write # jeton OIDC pour AWS
      contents: read
    env:
      NUXT_PUBLIC_API_BASE: https://3z9imkuxde.execute-api.eu-north-1.amazonaws.com
      S3_BUCKET: pokewish-static-805815160134
      CLOUDFRONT_DISTRIBUTION_ID: E1G23D8DCWMLIO
      SITE_URL: https://d1nxawsm2mnxx8.cloudfront.net
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            front/node_modules
            front/.nuxt
          key: front-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('front/package-lock.json') }}
          fail-on-cache-miss: true
      - name: Generate (une page HTML par Pokémon)
        run: npm run generate
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::805815160134:role/pokewish-github-deploy
          aws-region: eu-north-1
      - name: Envoi S3 + invalidation CloudFront
        run: bash scripts/publish-static.sh
      - name: Vérification (/pokemon/pikachu en HTML statique)
        run: |
          sleep 20
          html=$(curl -sf --retry 5 --retry-all-errors "$SITE_URL/pokemon/pikachu")
          echo "$html" | grep -o '<title>[^<]*</title>'
          echo "$html" | grep -q "$NUXT_PUBLIC_API_BASE" || { echo "API AWS absente"; exit 1; }
