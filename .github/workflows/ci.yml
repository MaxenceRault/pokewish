name: CI

# Chaque push (toutes branches) lance la CI, visible dans l'onglet Actions.
# Les checks s'affichent aussi dans la PR de la branche, une seule fois.
on:
  push:

# Un job par contrôle et par projet (front = Nuxt, back = API Hono) :
# chacun apparaît comme une coche séparée, et ils tournent en parallèle.
jobs:
  lint:
    name: Lint (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [front, back]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run lint

  prettier:
    name: Prettier (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [front, back]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run format:check

  typecheck:
    name: Typecheck (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [front, back]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Tests Vitest (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [front, back]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    name: Build (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [front, back]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run build

      # Back uniquement : on démarre l'API buildée et on vérifie GET /health
      - name: Smoke test GET /health
        if: matrix.project == 'back'
        run: |
          PORT=3001 npm start &
          for i in $(seq 1 20); do
            curl -sf http://localhost:3001/health && exit 0
            sleep 0.5
          done
          echo "GET /health n'a pas répondu 200" && exit 1

  # Le front et la vraie API ensemble, dans un navigateur (PokéAPI simulée)
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            front/package-lock.json
            back/package-lock.json
      - name: Install back
        run: npm ci
        working-directory: back
      - name: Install front
        run: npm ci
        working-directory: front
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: front
      - name: Playwright
        run: npm run test:e2e
        working-directory: front
      # En cas d'échec : rapport HTML, captures et traces téléchargeables
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: front/playwright-report
          retention-days: 7
